global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: emqx_stats
    metrics_path: /api/v5/prometheus/stats
    static_configs:
      - targets:
          - emqx:18083

  - job_name: emqx_auth
    metrics_path: /api/v5/prometheus/auth
    static_configs:
      - targets:
          - emqx:18083

  - job_name: emqx_data_integration
    metrics_path: /api/v5/prometheus/data_integration
    static_configs:
      - targets:
          - emqx:18083
