x-app-environment: &app-environment
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_URL: '${APP_URL:?Set APP_URL in .env.production}'
    TRUSTED_PROXIES: '${TRUSTED_PROXIES:-*}'
    TRUSTED_HOSTS: '${TRUSTED_HOSTS:-}'
    OCTANE_SERVER: frankenphp
    OCTANE_HOST: 0.0.0.0
    OCTANE_PORT: 8000
    OCTANE_ADMIN_HOST: 127.0.0.1
    OCTANE_ADMIN_PORT: 2019
    OCTANE_MAX_REQUESTS: '${OCTANE_MAX_REQUESTS:-500}'
    OCTANE_HTTPS: '${OCTANE_HTTPS:-true}'
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    IOT_NATS_HOST: nats
    IOT_NATS_PORT: 4222
    IOT_MQTT_HOST: nats
    IOT_MQTT_PORT: 1883
    INGESTION_NATS_HOST: nats
    INGESTION_NATS_PORT: 4222
    REVERB_BROADCAST_HOST: reverb
    REVERB_BROADCAST_PORT: 8090
    REVERB_BROADCAST_SCHEME: http
    REVERB_BROADCAST_VERIFY_SSL: 'false'
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8090
    XDG_CONFIG_HOME: /app/storage/octane/xdg/config
    XDG_DATA_HOME: /app/storage/octane/xdg/data

x-app-service: &app-service
    image: '${APP_IMAGE:?Set APP_IMAGE in .env.production}'
    env_file:
        - '${PRODUCTION_ENV_FILE:-.env.production}'
    environment:
        <<: *app-environment
    restart: unless-stopped
    networks:
        - production
    volumes:
        - app-storage:/app/storage
        - app-bootstrap-cache:/app/bootstrap/cache
    depends_on:
        pgsql:
            condition: service_healthy
        redis:
            condition: service_healthy
        nats:
            condition: service_healthy

services:
    proxy:
        image: caddy:2-alpine
        env_file:
            - '${PRODUCTION_ENV_FILE:-.env.production}'
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        volumes:
            - './docker/production/Caddyfile:/etc/caddy/Caddyfile:ro'
            - caddy-data:/data
            - caddy-config:/config
        networks:
            - production
        depends_on:
            - web
            - reverb
        restart: unless-stopped

    web:
        <<: *app-service
        command: ./scripts/start-production-octane.sh
        healthcheck:
            test:
                - CMD-SHELL
                - php artisan about --only=environment >/dev/null 2>&1
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    reverb:
        <<: *app-service
        command: php artisan reverb:start --host=0.0.0.0 --port=8090
        stop_grace_period: 30s

    iot-listen-states:
        <<: *app-service
        command: php artisan iot:listen-for-device-states --host=nats --port=4222

    iot-listen-presence:
        <<: *app-service
        command: php artisan iot:listen-for-device-presence --host=nats --port=4222

    iot-ingest-telemetry:
        <<: *app-service
        command:
            - php
            - artisan
            - iot:ingest-telemetry
            - --host=nats
            - --port=4222
            - '--subject=${INGESTION_NATS_SUBJECT:->}'

    horizon:
        <<: *app-service
        command: php artisan horizon
        stop_grace_period: 1h

    scheduler:
        <<: *app-service
        command: php artisan schedule:work

    pgsql:
        image: timescale/timescaledb:2.18.2-pg16
        env_file:
            - '${PRODUCTION_ENV_FILE:-.env.production}'
        environment:
            PGPASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env.production}'
            POSTGRES_DB: '${DB_DATABASE:?Set DB_DATABASE in .env.production}'
            POSTGRES_USER: '${DB_USERNAME:?Set DB_USERNAME in .env.production}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?Set DB_PASSWORD in .env.production}'
        volumes:
            - pgsql-data:/var/lib/postgresql/data
        networks:
            - production
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:?Set DB_DATABASE in .env.production}'
                - '-U'
                - '${DB_USERNAME:?Set DB_USERNAME in .env.production}'
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command:
            - redis-server
            - '--appendonly'
            - 'yes'
            - '--save'
            - '60'
            - '1'
        volumes:
            - redis-data:/data
        networks:
            - production
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    nats:
        image: nats:2.11-alpine
        command:
            - '-c'
            - '/etc/nats/nats.conf'
        ports:
            - '${NATS_CLIENT_BIND:-0.0.0.0}:${FORWARD_NATS_PORT:-4222}:4222'
            - '${NATS_MQTT_BIND:-0.0.0.0}:${FORWARD_NATS_MQTT_PORT:-1883}:1883'
            - '${NATS_MONITORING_BIND:-127.0.0.1}:${FORWARD_NATS_MONITORING_PORT:-8222}:8222'
        volumes:
            - './docker/nats/nats.conf:/etc/nats/nats.conf:ro'
            - nats-data:/data
        networks:
            - production
        healthcheck:
            test:
                - CMD-SHELL
                - wget -qO- http://127.0.0.1:8222/healthz >/dev/null
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    node-red:
        image: nodered/node-red:4.1.1
        env_file:
            - '${PRODUCTION_ENV_FILE:-.env.production}'
        environment:
            TZ: '${APP_TIMEZONE:-UTC}'
            MQTT_BROKER_HOST: '${NODE_RED_MQTT_BROKER_HOST:-nats}'
            MQTT_BROKER_PORT: '${NODE_RED_MQTT_BROKER_PORT:-1883}'
        ports:
            - '${NODE_RED_BIND:-127.0.0.1}:${FORWARD_NODE_RED_PORT:-1880}:1880'
        volumes:
            - node-red-data:/data
        networks:
            - production
        depends_on:
            nats:
                condition: service_healthy
        restart: unless-stopped

networks:
    production:
        driver: bridge

volumes:
    app-storage:
        driver: local
    app-bootstrap-cache:
        driver: local
    caddy-data:
        driver: local
    caddy-config:
        driver: local
    pgsql-data:
        driver: local
    redis-data:
        driver: local
    nats-data:
        driver: local
    node-red-data:
        driver: local
